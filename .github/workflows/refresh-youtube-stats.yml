name: Refresh YouTube subscriber count
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch subscriber count
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_channel_stats.py
      - name: Publish statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube subscriber count"
            git push
          fi
